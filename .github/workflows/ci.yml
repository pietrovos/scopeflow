name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://scopeflow_app:scopeflow_app@localhost:5544/scopeflow_test
      TEST_DATABASE_OWNER_URL: postgresql://scopeflow_owner:scopeflow_owner@localhost:5544/scopeflow_test
      DATABASE_URL: postgresql://scopeflow_app:scopeflow_app@localhost:5544/scopeflow
      DATABASE_OWNER_URL: postgresql://scopeflow_owner:scopeflow_owner@localhost:5544/scopeflow
      OIDC_ISSUER: http://localhost:8180/realms/scopeflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create database roles
        run: psql postgresql://postgres:postgres@localhost:5544/postgres -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scopeflow/shared build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate and seed a fresh database
        run: pnpm --filter @scopeflow/api db:migrate && pnpm --filter @scopeflow/api db:seed
      - name: Build
        run: pnpm --filter @scopeflow/api build && pnpm --filter @scopeflow/web build
